<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Failed Payments — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Failed Payments</span>
      <div class="topbar-actions">
        <a href="create-payment.html" class="btn btn-primary btn-sm">+ New Payment</a>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1>Failed Payments</h1>
        <p>Payments with status <span class="badge badge-failed">FAILED</span> — includes failure reason and retry count.</p>
      </div>

      <div class="card">
        <div class="section-header">
          <h2 id="failed-title">Loading…</h2>
          <button class="btn btn-secondary btn-sm" id="refresh-btn">↺ Refresh</button>
        </div>
        <div id="failed-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/failed-payments.js"></script>
</body>
</html>
