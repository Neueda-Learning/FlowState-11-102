<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- Sidebar injected by sidebar.js -->

<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <div class="topbar-badge">
          <span class="status-dot"></span>
          Backend: <span id="server-status">Checking…</span>
        </div>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1>Overview</h1>
        <p>Real-time summary of accounts and payments from the backend.</p>
      </div>

      <!-- ── Stats ─────────────────────────────────────────── -->
      <div class="stats-grid" id="stats-grid">
        <!-- Populated by dashboard.js -->
        <div class="stat-card"><div class="spinner-wrap"><div class="spinner"></div></div></div>
        <div class="stat-card"><div class="spinner-wrap"><div class="spinner"></div></div></div>
        <div class="stat-card"><div class="spinner-wrap"><div class="spinner"></div></div></div>
        <div class="stat-card"><div class="spinner-wrap"><div class="spinner"></div></div></div>
        <div class="stat-card"><div class="spinner-wrap"><div class="spinner"></div></div></div>
      </div>

      <!-- ── Recent Accounts ───────────────────────────────── -->
      <div class="card" style="margin-bottom:24px">
        <div class="section-header">
          <h2>Recent Accounts</h2>
          <a href="accounts.html" class="btn btn-secondary btn-sm">View All</a>
        </div>
        <div class="table-wrapper" id="recent-accounts-table">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- ── Recent Payments ───────────────────────────────── -->
      <div class="card">
        <div class="section-header">
          <h2>Recent Payments</h2>
          <a href="payments.html" class="btn btn-secondary btn-sm">View All</a>
        </div>
        <div id="dashboard-error" style="display:none"></div>
        <div class="table-wrapper" id="recent-payments-table">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
