<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounts — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Accounts</span>
      <div class="topbar-actions">
        <a href="create-payment.html" class="btn btn-primary btn-sm">+ New Payment</a>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1>All Accounts</h1>
        <p>Fetched from <code>GET /account/</code></p>
      </div>

      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search by name, number or status…" />
        <select id="status-filter">
          <option value="">All Statuses</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
          <option value="BLOCKED">BLOCKED</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="refresh-btn">↺ Refresh</button>
      </div>

      <div class="card">
        <div id="accounts-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/accounts.js"></script>
</body>
</html>
