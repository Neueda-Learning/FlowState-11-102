<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Payments</span>
      <div class="topbar-actions">
        <a href="create-payment.html" class="btn btn-primary btn-sm">+ New Payment</a>
      </div>
    </header>

    <main class="page-body">
      <div class="page-header">
        <h1>Payment Records</h1>
        <p>Search by payment ID, reference, or browse by account.</p>
      </div>

      <!-- ── Lookup forms ──────────────────────────────────────── -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:24px">

        <div class="card">
          <h3 style="font-size:.95rem;margin-bottom:14px">Look up by Payment ID</h3>
          <div style="display:flex;gap:8px">
            <input type="number" id="lookup-payment-id" placeholder="e.g. 1" min="1" />
            <button class="btn btn-primary btn-sm" id="lookup-by-id-btn">Search</button>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:.95rem;margin-bottom:14px">Look up by Reference</h3>
          <div style="display:flex;gap:8px">
            <input type="text" id="lookup-payment-reference" placeholder="e.g. PAY-2026-..." />
            <button class="btn btn-primary btn-sm" id="lookup-by-reference-btn">Search</button>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:.95rem;margin-bottom:14px">Look up by Account ID</h3>
          <div style="display:flex;gap:8px">
            <input type="number" id="lookup-account-id" placeholder="e.g. 1" min="1" />
            <button class="btn btn-primary btn-sm" id="lookup-by-account-btn">Load</button>
          </div>
        </div>

      </div>

      <!-- ── Results ───────────────────────────────────────────── -->
      <div class="card">
        <div class="section-header">
          <h2 id="results-title">All Payments (sampled from accounts)</h2>
          <button class="btn btn-secondary btn-sm" id="refresh-btn">↺ Refresh</button>
        </div>
        <div id="payments-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
