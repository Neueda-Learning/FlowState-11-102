<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Details — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Payment Details</span>
      <div class="topbar-actions">
        <a href="payments.html" class="btn btn-secondary btn-sm">← Back to Payments</a>
      </div>
    </header>

    <main class="page-body">
      <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a>
        <span class="sep">›</span>
        <a href="payments.html">Payments</a>
        <span class="sep">›</span>
        <span class="current" id="breadcrumb-id">…</span>
      </div>

      <div class="card result-card">
        <div class="section-header">
          <h2>Payment Information</h2>
          <span id="payment-status-badge"></span>
        </div>
        <div id="payment-detail-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
        <div id="payment-actions" style="display:none;margin-top:24px;display:flex;gap:10px;flex-wrap:wrap"></div>
      </div>

      <div class="card" style="margin-top:24px">
        <div class="section-header">
          <h2>Processing Timeline</h2>
        </div>
        <div id="payment-history-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/payment-details.js"></script>
</body>
</html>
