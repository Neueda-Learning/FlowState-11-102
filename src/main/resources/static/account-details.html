<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Details — FlowState</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="main-content">

    <header class="topbar">
      <span class="topbar-title">Account Details</span>
      <div class="topbar-actions">
        <a href="accounts.html" class="btn btn-secondary btn-sm">← Back</a>
      </div>
    </header>

    <main class="page-body">
      <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a>
        <span class="sep">›</span>
        <a href="accounts.html">Accounts</a>
        <span class="sep">›</span>
        <span class="current" id="breadcrumb-id">…</span>
      </div>

      <!-- Account info card -->
      <div class="card" style="margin-bottom:24px">
        <div class="section-header">
          <h2>Account Information</h2>
          <span id="account-status-badge"></span>
        </div>
        <div id="account-detail-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Payments for this account -->
      <div class="card">
        <div class="section-header">
          <h2>Account History</h2>
          <a id="new-payment-link" href="create-payment.html" class="btn btn-primary btn-sm">+ New Payment</a>
        </div>
        <div id="account-payments-container">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>


    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/account-details.js"></script>
</body>
</html>
