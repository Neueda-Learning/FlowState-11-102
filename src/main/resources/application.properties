spring.application.name=PaymentProcessingSystem
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/paymentprocessingsystem?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${SERVER_PORT:8080}
# Run schema.sql and data.sql on startup (creates tables + seeds if missing)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# Payment gateway endpoint (used by GatewayClientImpl)
gateway.base-url=${GATEWAY_BASE_URL:http://localhost:8081}
